  <!-- Clickable chip 4 -->
  <g id="chip-ls-e1460aipqjlbt" class="clickable" role="button" tabindex="0" aria-pressed="false"
     aria-label="选择 LS-E1460AIPQJLBT 芯片" data-part-number="LS-E1460AIPQJLBT"
     onclick="toggleNode(event, this)" onkeydown="activateNode(event, this)">
    <title>LS-E1460AIPQJLBT 蓝牙钥匙主控 MCU。点击切换高亮。</title>
    <rect class="box gray node-shape" x="526" y="384" width="273" height="290" rx="12"/>
    <rect class="hit-area" x="518" y="376" width="289" height="306"/>
    <text class="t h1" x="662" y="442">LS-E1460AIPQJLBT</text>
    <text class="t h1" x="662" y="478">MCU</text>
    <text class="t h2" x="662" y="510">(蓝牙钥匙主控)</text>
    <text class="t body left" x="552" y="548">• 车规级</text>
    <text class="t body left" x="552" y="574">• 集成 BLE（根据型号）</text>
    <text class="t body left" x="552" y="600">• 负责整车逻辑控制</text>
    <text class="t body left" x="552" y="626">• 外设管理与安全交互</text>
  </g>

  <!-- Clickable chip 5 -->
  <g id="chip-bs21q333a" class="clickable" role="button" tabindex="0" aria-pressed="false"
