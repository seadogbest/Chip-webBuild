<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"
     role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">蓝牙钥匙主模块——国产芯片连接框图</title>
  <desc id="svg-desc">国产蓝牙钥匙建议架构全矢量框图。八个标注芯片型号的节点可以点击并切换为蓝色高亮。</desc>

  <defs>
    <marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#111827"/>
    </marker>
    <marker id="arrow-black-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M10 0 L0 5 L10 10 Z" fill="#111827"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc1717"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1d4ed8"/>
    </marker>
    <linearGradient id="panel-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#d9f2ff"/>
    </linearGradient>
    <filter id="selected-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d4ed8" flood-opacity=".38"/>
    </filter>
  </defs>

  <style>
    .t { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .title { font-size: 39px; font-weight: 800; fill: #082859; letter-spacing: 1px; }
    .h1 { font-size: 22px; font-weight: 800; }
    .h2 { font-size: 18px; font-weight: 700; }
    .body { font-size: 17px; font-weight: 500; }
    .small { font-size: 15px; }
    .tiny { font-size: 13px; }
    .left { text-anchor: start; }
    .box { stroke: #3e4650; stroke-width: 2; }
    .neutral { fill: #f8fafc; }
    .orange { fill: #ffe0bf; stroke: #b45309; }
    .green { fill: #b8ec96; stroke: #2f6b30; }
    .gray { fill: #e2e4e7; }
    .blue { fill: #c9e2ff; stroke: #155da8; }
    .purple { fill: #dfd1ff; stroke: #5b21b6; }
    .wire { fill: none; stroke: #111827; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
    .wire-red { fill: none; stroke: #dc1717; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
    .wire-blue { fill: none; stroke: #1d4ed8; stroke-width: 3; stroke-dasharray: 9 7; }
    .end { marker-end: url(#arrow-black); }
    .both { marker-start: url(#arrow-black-start); marker-end: url(#arrow-black); }
    .red-end { marker-end: url(#arrow-red); }
    .blue-end { marker-end: url(#arrow-blue); }
    .signal { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #111827; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
    .power-label { fill: #c1121f; font-size: 17px; font-weight: 800; }
    .clickable { cursor: pointer; outline: none; }
    .clickable .node-shape { transition: fill .16s ease, stroke .16s ease, stroke-width .16s ease; }
    .clickable:hover .node-shape,
    .clickable:focus .node-shape { stroke: #2563eb; stroke-width: 4; }
    .clickable.selected .node-shape { fill: #2f80ed; stroke: #1557b0; stroke-width: 4; filter: url(#selected-shadow); }
    .clickable.selected .t { fill: #fff; }
    .hit-area { fill: transparent; stroke: none; }
  </style>

  <rect width="1672" height="941" fill="#fff"/>
  <text class="t title" x="836" y="39">蓝牙钥匙主模块——国产芯片连接框图（建议架构）</text>

  <!-- Wiring: draw beneath all modules -->
  <g id="wiring">
    <path class="wire end" d="M162 141 H209"/>

    <!-- Power network -->
    <path class="wire-red red-end" d="M377 135 H565"/>
    <path class="wire-red red-end" d="M402 135 V249 H445"/>
    <path class="wire-red" d="M731 249 H791 V313 H292 V441"/>
    <path class="wire-red red-end" d="M292 313 V441"/>
    <path class="wire-red" d="M864 135 H1158 V466"/>
    <path class="wire-red" d="M1158 330 H661 V384"/>
    <path class="wire-red red-end" d="M661 330 V384"/>
    <path class="wire-red red-end" d="M1009 330 V425"/>
    <path class="wire-red red-end" d="M445 330 V360 H405 V459"/>
    <path class="wire-red red-end" d="M742 674 V759"/>

    <!-- CAN path -->
    <path class="wire both" d="M172 492 H215"/>
    <path class="wire both" d="M172 518 H215"/>
    <path class="wire both" d="M405 498 H526"/>

    <!-- MCU to wireless SoC -->
    <path class="wire both" d="M799 498 H931"/>
    <path class="wire end" d="M1095 498 H1120"/>
    <path class="wire both" d="M1013 570 V606"/>

    <!-- Antenna and phone wireless path -->
    <path class="wire" d="M1215 498 H1259 V471"/>
    <path class="wire" d="M1241 453 H1277 L1259 479 Z M1241 480 H1277"/>
    <path class="wire-blue blue-end" d="M1279 498 H1320"/>
    <path class="wire-blue blue-end" d="M1290 480 Q1311 498 1290 516"/>
    <path class="wire-blue" d="M1300 468 Q1334 498 1300 528"/>

    <!-- Storage and secure chip buses -->
    <path class="wire end" d="M564 674 V730 H490 V759"/>
    <path class="wire end" d="M668 674 V730 H727 V759"/>
    <path class="wire end" d="M782 674 V705 H960 V759"/>

    <!-- Right-side work chain -->
    <path class="wire end" d="M1543 188 V217"/>
    <path class="wire end" d="M1543 286 V319"/>
    <path class="wire end" d="M1543 389 V421"/>
    <path class="wire end" d="M1543 491 V524"/>
    <path class="wire end" d="M1543 579 V612"/>
    <path class="wire end" d="M1543 667 V700"/>
    <path class="wire end" d="M1543 755 V788"/>
  </g>

  <!-- Power and bus labels -->
  <g id="connection-labels">
    <text class="signal power-label" x="402" y="113">12V（受保护）</text>
    <text class="signal power-label" x="892" y="113">3.3V（主电源）</text>
    <text class="signal power-label" x="754" y="232">5V</text>
    <text class="signal power-label" x="303" y="374">VCC = 5V</text>
    <text class="signal power-label" x="677" y="359">3.3V</text>
    <text class="signal power-label" x="1022" y="379">3.3V</text>
    <text class="signal" x="431" y="483">TXD / RXD</text>
    <text class="signal" x="421" y="537">STB</text>
    <text class="signal tiny" x="424" y="558">(VIO = 3.3V)</text>
    <text class="signal" x="798" y="466">UART / SPI / GPIO</text>
    <text class="signal tiny" x="824" y="486">(按方案配置)</text>
    <text class="signal" x="452" y="716">SPI / QSPI</text>
    <text class="signal" x="696" y="716">SPI</text>
    <text class="signal" x="987" y="716">SPI / I²C</text>
    <text class="signal tiny" x="985" y="738">(按实际配置)</text>
  </g>

  <!-- Input and protection -->
  <g id="vehicle-power-input">
    <title>KL30 / 12 V 车载电源输入</title>
    <rect class="box neutral" x="7" y="92" width="155" height="98" rx="10"/>
    <text class="t h2" x="84" y="119">KL30 / 12V</text>
    <text class="t body" x="84" y="145">车载电源</text>
    <text class="t body" x="84" y="171">(8–16V 典型)</text>
  </g>
  <g id="tvs-protection">
    <title>反接与浪涌保护</title>
    <rect class="box orange" x="209" y="106" width="168" height="73" rx="10"/>
    <text class="t h2" x="293" y="132">TVS</text>
    <text class="t body" x="293" y="157">反接与浪涌保护</text>
  </g>

  <!-- Clickable chip 1 -->
  <g id="chip-sgm61330cqtuk12g-tr" class="clickable" role="button" tabindex="0" aria-pressed="false"
     aria-label="选择 SGM61330CQTUK12G/TR 芯片" data-part-number="SGM61330CQTUK12G/TR"
     onclick="toggleNode(event, this)" onkeydown="activateNode(event, this)">
    <title>SGM61330CQTUK12G/TR 宽压同步 Buck。点击切换高亮。</title>
    <rect class="box orange node-shape" x="565" y="85" width="299" height="100" rx="11"/>
    <rect class="hit-area" x="557" y="77" width="315" height="116"/>
    <text class="t h1" x="714" y="113">SGM61330CQTUK12G/TR</text>
    <text class="t h2" x="714" y="138">宽压同步 Buck</text>
    <text class="t body" x="714" y="164">3.8–36V 输入，可配置 3.3V 输出</text>
  </g>

  <!-- Clickable chip 2 -->
  <g id="chip-nsr31050-qstar" class="clickable" role="button" tabindex="0" aria-pressed="false"
     aria-label="选择 NSR31050-QSTAR 芯片" data-part-number="NSR31050-QSTAR"
     onclick="toggleNode(event, this)" onkeydown="activateNode(event, this)">
