    <text class="t body" x="588" y="264">40V 输入，固定 5V / 150mA LDO</text>
  </g>

  <!-- Vehicle CAN -->
  <g id="vehicle-can-bus">
    <title>车身 CAN 总线 BCM / PEPS</title>
    <rect class="box neutral" x="12" y="425" width="160" height="146" rx="10"/>
    <text class="t h2" x="92" y="459">车身 CAN 总线</text>
    <text class="t h2" x="92" y="485">(BCM / PEPS)</text>
    <text class="t body" x="92" y="523">CANH</text>
    <text class="t body" x="92" y="550">CANL</text>
