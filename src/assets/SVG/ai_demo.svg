  <text class="t body" x="836" y="914" fill="#475569">实际接口、电源电压及外围阻容/晶振参数以各芯片 Datasheet 与最终原理图为准</text>

  <script><![CDATA[
    function toggleNode(event, node) {
      if (event) event.stopPropagation();
      node.classList.toggle('selected');
      node.setAttribute('aria-pressed', node.classList.contains('selected') ? 'true' : 'false');
    }
    function activateNode(event, node) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleNode(event, node);
      }
    }
  ]]></script>
</svg>
