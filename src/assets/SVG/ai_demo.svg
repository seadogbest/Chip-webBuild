    <rect x="1331" y="444" width="46" height="87" rx="4" fill="#a8d8ff" stroke="#5e8fb8" stroke-width="2"/>
    <rect x="1345" y="440" width="18" height="3" rx="2" fill="#6b7280"/>
    <circle cx="1354" cy="537" r="5" fill="#dbeafe" stroke="#111827" stroke-width="2"/>
